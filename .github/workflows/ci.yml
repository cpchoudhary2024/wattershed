name: ci

on:
  push:
    branches: [main]
    # Loop guard: data_sync.yml pushes these paths back to main. A
    # GITHUB_TOKEN push does not start workflows, so this is belt-and-braces
    # for a replayed or manually re-pushed sync commit.
    paths-ignore:
      - "data/news/**"
      - "site/data/**"
      # Narrow, not data/processed/** — that directory also holds the
      # committed reference table, and a genuine `build-reference` rebuild
      # must still run CI.
      - "data/processed/facility_registry.json"
      - "data/processed/infrastructure_density.json"
      - "data/processed/eia_capacity.json"
      - "data/processed/data_sync_manifest.json"
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Unit tests (offline — network sources are exercised by the
              reproduction guide, not CI)
        run: pytest -q
